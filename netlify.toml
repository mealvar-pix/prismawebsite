[build]
  publish = "."

# Dominio único: la dirección de Netlify redirige al dominio propio.
# HTTP -> HTTPS y HSTS (max-age=31536000) los aplica Netlify automáticamente en el dominio.
[[redirects]]
  from = "https://prismainteligente.netlify.app/*"
  to = "https://prismainteligente.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Bloque 4: recursos con huella de contenido en el nombre (assets/nombre.<hash>.ext).
# Si el contenido cambia, cambia el nombre: se pueden guardar en caché un año sin riesgo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Capturas de Budget Intelligence (Bloque 3): nombre sin huella, caché moderada de un día.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
