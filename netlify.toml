[build]
  publish = "."

# Dominio único: la dirección de Netlify redirige al dominio propio.
# HTTP -> HTTPS y HSTS (max-age=31536000) los aplica Netlify automáticamente en el dominio.
[[redirects]]
  from = "https://prismainteligente.netlify.app/*"
  to = "https://prismainteligente.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
